services:
  sac-uto-scraper:
    build:
      context: .
    image: sac-uto-scraper:latest
    container_name: sac-uto-scraper
    hostname: sac-uto-scraper
    restart: unless-stopped
    command: ["python", "db_browser.py", "--db", "/data/data.sqlite", "--data-dir", "/data", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PYTHONUNBUFFERED: "1"
      SCRAPER_DB_PATH: /data/data.sqlite
    ports:
      - "${SQLITE_DOWNLOAD_BIND:-0.0.0.0:8084}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
